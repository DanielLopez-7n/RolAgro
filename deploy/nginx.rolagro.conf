# Reverse proxy de Nginx para RolAgro.
#
# Instalación en el VPS:
#   sudo cp deploy/nginx.rolagro.conf /etc/nginx/sites-available/rolagro
#   sudo nano /etc/nginx/sites-available/rolagro   # reemplazar tudominio.com
#   sudo ln -s /etc/nginx/sites-available/rolagro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, "sudo certbot --nginx -d tudominio.com -d www.tudominio.com" agrega
# HTTPS y reescribe este archivo automáticamente (no hace falta tocar el
# bloque de SSL a mano). Ver DEPLOY.md, Fase 2.

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # Límite de tamaño del cuerpo alineado con express.json({ limit: "100kb" })
    # de src/index.js, con margen para headers.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Estos tres headers son los que permiten que
        # app.set("trust proxy", 1) en src/index.js vea la IP real del
        # visitante en vez de la del propio Nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
