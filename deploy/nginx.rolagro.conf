# Reverse proxy de Nginx para RolAgro.
#
# Instalación en el VPS:
#   sudo cp deploy/nginx.rolagro.conf /etc/nginx/sites-available/rolagro
#   sudo nano /etc/nginx/sites-available/rolagro   # reemplazar tudominio.com
#   sudo ln -s /etc/nginx/sites-available/rolagro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Después, "sudo certbot --nginx -d tudominio.com -d www.tudominio.com" agrega
# HTTPS y reescribe este archivo automáticamente (no hace falta tocar el
# bloque de SSL a mano). Ver DEPLOY.md, Fase 2.

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com www.tudominio.com;

    # El cuerpo de un pedido son unos pocos KB (express.json usa 100kb), pero
    # el panel también sube el Excel del ERP, y ahí el límite que manda es el
    # de Nginx: si fuera menor que el de la app, Nginx cortaría con un 413
    # crudo y el mensaje de error propio de uploadExcel.js nunca llegaría a
    # verse. Se deja alineado con MAX_FILE_BYTES (5 MB) de
    # src/services/inventoryImport.service.js.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Estos tres headers son los que permiten que
        # app.set("trust proxy", 1) en src/index.js vea la IP real del
        # visitante en vez de la del propio Nginx.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La importación del ERP procesa miles de filas contra MySQL dentro de la
    # misma petición. Con el timeout por defecto de Nginx (60s), una carga
    # inicial grande devolvería un 504 al navegador MIENTRAS la importación
    # sigue corriendo en el servidor: el administrador vería un error de algo
    # que en realidad va a terminar bien, y probablemente reintentaría.
    # Reimportar es idempotente (empareja por sku), así que un reintento no
    # duplica nada, pero es confuso. Solo esta ruta necesita el margen extra.
    location /admin/api/inventory/import {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
